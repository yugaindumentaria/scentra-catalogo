<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scentra Fragancias | Catálogo</title>
<style>
  :root{
    --gold:#c9a24b;
    --gold-light:#e2c581;
    --black:#0e0e0e;
    --black-soft:#161616;
    --card:#1b1b1b;
    --text:#f1ecdf;
    --text-dim:#b9b2a0;
    --green:#25D366;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{overflow-x:hidden;}
  body{
    background:var(--black);
    color:var(--text);
    font-family:'Segoe UI', Helvetica, Arial, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  header{
    background:linear-gradient(135deg, var(--black-soft) 0%, #000 100%);
    border-bottom:1px solid var(--gold);
    padding:28px 20px 22px;
    text-align:center;
  }
  header .logo{
    display:block;
    margin:0 auto 10px;
    height:90px;
    width:auto;
  }
  header h1{
    font-family:Georgia, 'Times New Roman', serif;
    letter-spacing:6px;
    font-size:clamp(28px,5vw,44px);
    color:var(--gold-light);
    font-weight:400;
  }
  header p{
    color:var(--text-dim);
    letter-spacing:2px;
    font-size:12px;
    margin-top:6px;
    text-transform:uppercase;
  }
  .controls{
    max-width:1200px;
    margin:24px auto 0;
    padding:0 20px;
  }
  .search-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .search-row input{
    flex:1;
    background:var(--black-soft);
    border:1px solid #3a3226;
    color:var(--text);
    padding:12px 16px;
    border-radius:8px;
    font-size:15px;
    outline:none;
  }
  .search-row input:focus{border-color:var(--gold);}
  .filters{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:10px;
    margin-bottom:10px;
  }
  .filters select{
    background:var(--black-soft);
    border:1px solid #3a3226;
    color:var(--text);
    padding:10px 10px;
    border-radius:8px;
    font-size:14px;
    outline:none;
  }
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--text-dim);
    font-size:13px;
    margin:12px 0 6px;
    flex-wrap:wrap;
    gap:8px;
  }
  .meta-row span.count{color:var(--gold-light); font-weight:600;}
  .reset-btn{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-light);
    padding:6px 14px;
    border-radius:20px;
    font-size:12px;
    cursor:pointer;
  }
  .reset-btn:hover{background:var(--gold); color:#000;}
  .grid{
    max-width:1300px;
    margin:0 auto;
    padding:10px 20px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:22px;
  }
  .card{
    background:var(--card);
    border:1px solid #2a2a2a;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform .25s cubic-bezier(.22,.61,.36,1), box-shadow .25s ease, border-color .25s ease;
    cursor:pointer;
  }
  .card:hover{
    transform:translateY(-6px);
    border-color:var(--gold);
    box-shadow:0 14px 30px rgba(0,0,0,.5);
  }
  .card-img{
    width:100%;
    aspect-ratio:1/1;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .card-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .3s cubic-bezier(.22,.61,.36,1);
  }
  .card:hover .card-img img{
    transform:scale(1.08);
  }
  .no-photo{
    color:var(--text-dim);
    font-size:12px;
    text-align:center;
    padding:10px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .card-body{
    padding:12px 14px 14px;
    display:flex;
    flex-direction:column;
    flex:1;
  }
  .card-brand{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-bottom:2px;
  }
  .card-name{
    font-size:17px;
    font-weight:600;
    color:var(--text);
    margin-bottom:6px;
    line-height:1.25;
  }
  .card-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .tag{
    font-size:11px;
    background:#262218;
    color:var(--text-dim);
    padding:3px 8px;
    border-radius:12px;
    border:1px solid #3a3226;
  }
  .card-price{
    margin-top:auto;
    font-size:19px;
    font-weight:700;
    color:var(--gold-light);
    margin-bottom:10px;
  }
  .card-price.consult{font-size:15px; color:var(--text-dim); font-weight:600;}
  .wa-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--green);
    color:#fff;
    text-decoration:none;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
  }
  .wa-btn:hover{filter:brightness(1.08);}
  .empty-state{
    text-align:center;
    color:var(--text-dim);
    padding:60px 20px;
    grid-column:1/-1;
  }
  footer{
    border-top:1px solid #2a2a2a;
    text-align:center;
    padding:26px 20px;
    color:var(--text-dim);
    font-size:12px;
    letter-spacing:1px;
  }
  footer .brand{color:var(--gold-light); letter-spacing:3px; font-size:13px; margin-bottom:6px; display:block;}
  @media (max-width:480px){
    .grid{grid-template-columns:repeat(2,1fr); gap:12px; padding:10px 12px 40px;}
    .card-name{font-size:14px;}
    .card-price{font-size:16px;}
    header h1{letter-spacing:3px;}
  }  .float-actions{
    position:fixed;
    right:18px;
    bottom:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    z-index:100;
  }
  .float-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.45);
    cursor:pointer;
    border:none;
    text-decoration:none;
  }
  .float-btn.whatsapp{
    background:var(--green);
  }
  .float-btn.whatsapp svg{width:28px; height:28px;}
  .float-btn.top{
    background:var(--gold);
    opacity:0;
    pointer-events:none;
    transform:translateY(10px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .float-btn.top.show{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }
  .float-btn.top svg{width:24px; height:24px;}
  @media (max-width:480px){
    .float-actions{right:12px; bottom:16px; gap:10px;}
    .float-btn{width:46px; height:46px;}
  }

  /* ===== MODAL DE IMAGEN (SOLO FOTO) ===== */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease;
  }
  .modal-overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  .modal-box{
    background:transparent;
    border-radius:14px;
    max-width:92vw;
    width:auto;
    max-height:92vh;
    position:relative;
    transform:scale(.94);
    transition:transform .22s cubic-bezier(.22,.61,.36,1);
  }
  .modal-overlay.show .modal-box{
    transform:scale(1);
  }
  .modal-close{
    position:absolute;
    top:-14px;
    right:-14px;
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    border:1px solid var(--gold);
    color:var(--text);
    font-size:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:2;
  }
  .modal-close:hover{background:var(--gold); color:#000;}
  .modal-img{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    overflow:hidden;
  }
  .modal-img img{
    display:block;
    max-width:92vw;
    max-height:92vh;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:14px;
  }
  @media (max-width:480px){
    .modal-close{top:-12px; right:-2px;}
  }

  /* ===== CARRITO ===== */
  header{position:relative;}
  .add-btn{
    display:block; width:100%; background:var(--gold); color:#000; border:none;
    padding:11px 10px; border-radius:8px; font-size:13px; font-weight:700;
    cursor:pointer; transition:background .2s ease, color .2s ease;
  }
  .add-row{display:flex; align-items:stretch; gap:6px;}
  .add-row .add-btn{flex:1; min-width:0; width:auto; padding:11px 6px;}
  .qty-btn{
    flex:none; width:40px; background:transparent; color:var(--gold-light);
    border:1px solid var(--gold); border-radius:8px; font-size:20px; font-weight:700;
    line-height:1; cursor:pointer; transition:background .2s ease, color .2s ease;
  }
  .qty-btn:hover:not(:disabled){background:var(--gold); color:#000;}
  .qty-btn:disabled{opacity:.3; cursor:default;}
  .add-btn:hover{background:var(--gold-light);}
  .add-btn.added{background:transparent; color:var(--gold-light); box-shadow:inset 0 0 0 1px var(--gold);}
  .float-btn.cart{background:var(--black-soft); border:1.5px solid var(--gold); position:relative;}
  .float-btn.cart svg{width:26px; height:26px;}
  .fbadge{
    position:absolute; top:-5px; right:-5px; min-width:21px; height:21px; padding:0 5px;
    border-radius:11px; background:var(--gold); color:#000; font-size:11px; font-weight:700;
    display:none; align-items:center; justify-content:center;
  }
  .fbadge.show{display:flex;}
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px);
    background:var(--black-soft); border:1px solid var(--gold); color:var(--text);
    padding:10px 18px; border-radius:24px; font-size:13px; text-align:center;
    max-width:88vw; z-index:400; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
  .cart-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:300;
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .cart-overlay.show{opacity:1; pointer-events:auto;}
  .cart-panel{
    position:absolute; top:0; right:0; height:100%; width:100%; max-width:440px;
    background:var(--card); border-left:1px solid var(--gold);
    display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .25s cubic-bezier(.22,.61,.36,1);
  }
  .cart-overlay.show .cart-panel{transform:translateX(0);}
  .cart-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid #2a2a2a;}
  .cart-title{font-family:Georgia,'Times New Roman',serif; letter-spacing:3px; color:var(--gold-light); font-size:19px;}
  .cart-sub{font-size:12px; color:var(--text-dim); margin-top:3px;}
  .cart-x{
    width:44px; height:44px; border-radius:50%; background:transparent; border:1px solid #3a3226;
    color:var(--text); font-size:24px; line-height:1; cursor:pointer; flex:none;
  }
  .cart-x:hover{background:var(--gold); color:#000;}
  .cart-list{flex:1; min-height:0; overflow-y:auto; padding:4px 18px; -webkit-overflow-scrolling:touch;}
  .cart-empty{text-align:center; color:var(--text-dim); padding:48px 10px; font-size:14px;}
  .cart-item{padding:14px 0; border-bottom:1px solid #2a2a2a;}
  .ci-name{font-weight:600; font-size:15px; line-height:1.25;}
  .ci-meta{font-size:12px; color:var(--text-dim); margin-top:3px;}
  .ci-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .qty{display:flex; align-items:center; border:1px solid #3a3226; border-radius:24px; overflow:hidden;}
  .qty button{width:44px; height:44px; background:transparent; border:none; color:var(--gold-light); font-size:22px; cursor:pointer;}
  .qty button:active{background:#262218;}
  .qty span{min-width:30px; text-align:center; font-weight:700;}
  .ci-sub{font-weight:700; color:var(--gold-light); font-size:15px; text-align:right;}
  .ci-del{background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline; cursor:pointer; padding:10px 0 2px;}
  .cart-foot{padding:14px 18px 18px; border-top:1px solid var(--gold); background:var(--black-soft);}
  .cart-total{display:flex; justify-content:space-between; align-items:baseline; font-size:21px; font-weight:700; color:var(--gold-light); margin-bottom:12px;}
  .cart-wa{
    display:flex; align-items:center; justify-content:center; background:var(--green); color:#fff;
    text-decoration:none; padding:16px 10px; border-radius:10px; font-size:16px; font-weight:700; text-align:center;
  }
  .cart-wa.disabled{opacity:.4; pointer-events:none;}
  .cart-secondary{display:flex; gap:10px; margin-top:10px;}
  .cart-secondary button{flex:1; min-height:46px; padding:10px; border-radius:10px; font-size:14px; cursor:pointer; background:transparent;}
  .btn-keep{border:1px solid var(--gold); color:var(--gold-light);}
  .btn-clear{border:1px solid #3a3226; color:var(--text-dim);}
  .btn-clear:disabled{opacity:.35; cursor:default;}
  .cart-confirm{position:absolute; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; padding:20px; z-index:5;}
  .cart-confirm.show{display:flex;}
  .confirm-box{background:var(--card); border:1px solid var(--gold); border-radius:12px; padding:22px 20px; width:100%; max-width:340px; text-align:center;}
  .confirm-box p{font-size:16px; margin-bottom:16px;}
  .confirm-box .row{display:flex; gap:10px;}
  .confirm-box button{flex:1; min-height:46px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;}
  .confirm-cancel{background:transparent; border:1px solid #3a3226; color:var(--text);}
  .confirm-ok{background:var(--gold); border:none; color:#000;}
  @media (max-width:600px){
    .cart-panel{
      top:auto; bottom:0; height:auto; max-height:88vh; max-height:88dvh; max-width:100%;
      border-left:none; border-top:1px solid var(--gold); border-radius:16px 16px 0 0;
      transform:translateY(100%);
    }
    .cart-overlay.show .cart-panel{transform:translateY(0);}
    .toast{bottom:80px;}
  }
</style>
</head>

// ======= LÓGICA =======
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const generoFilter = document.getElementById('generoFilter');
const presFilter = document.getElementById('presFilter');
const sortSelect = document.getElementById('sortSelect');
const countNum = document.getElementById('countNum');
const resetBtn = document.getElementById('resetBtn');

function populateSelect(select, values){
  values.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });
}

const presentaciones = [...new Set(PRODUCTS.map(p=>p.presentacion))].sort((a,b)=>{
  const na = parseFloat(a), nb = parseFloat(b);
  if(!isNaN(na) && !isNaN(nb)) return na-nb;
  return a.localeCompare(b,'es');
});
populateSelect(presFilter, presentaciones);

function money(n){
  return '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function waLink(p){
  const msg = `Hola, quisiera consultar por el perfume ${p.nombre} ${p.presentacion}.`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  const genero = generoFilter.value;
  const pres = presFilter.value;
  const sort = sortSelect.value;

  let list = PRODUCTS.filter(p=>{
    if(q && !p.nombre.toLowerCase().includes(q)) return false;
    if(genero && p.genero !== genero) return false;
    if(pres && p.presentacion !== pres) return false;
    return true;
  });

  if(sort === 'nombre') list.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  if(sort === 'precio_asc') list.sort((a,b)=>a.precio-b.precio);
  if(sort === 'precio_desc') list.sort((a,b)=>b.precio-a.precio);

  countNum.textContent = list.length;
  grid.innerHTML = '';

  if(list.length === 0){
    grid.innerHTML = '<div class="empty-state">No se encontraron perfumes con esos filtros.</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  list.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = p.id;

    const priceHtml = p.precio > 0
      ? `<div class="card-price">${money(p.precio)}</div>`
      : `<div class="card-price consult">Consultar precio</div>`;

    const imgHtml = p.img
      ? `<img src="${p.img}" alt="${p.nombre}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;no-photo&quot;>Foto<br>pendiente</div>'">`
      : `<div class="no-photo">Foto<br>pendiente</div>`;

    card.innerHTML = `
      <div class="card-img">${imgHtml}</div>
      <div class="card-body">
        <div class="card-brand">${p.marca}</div>
        <div class="card-name">${p.nombre}</div>
        <div class="card-tags">
          <span class="tag">${p.genero}</span>
          <span class="tag">${p.presentacion}</span>
        </div>
        ${priceHtml}
        ${p.precio > 0
          ? `<div class="add-row">
             <button type="button" class="qty-btn minus" data-id="${p.id}" aria-label="Quitar una unidad" disabled>&minus;</button>
             <button type="button" class="add-btn" data-id="${p.id}">Agregar al carrito</button>
             <button type="button" class="qty-btn plus" data-id="${p.id}" aria-label="Agregar una unidad">+</button>
           </div>`
          : `<a class="wa-btn" href="${waLink(p)}" target="_blank" rel="noopener">Consultar disponibilidad</a>`}
      </div>
    `;
    const addBtn = card.querySelector('.add-btn');
    if(addBtn){
      addBtn.addEventListener('click', (e)=>{ e.stopPropagation(); addToCart(p.id, addBtn); });
      card.querySelector('.plus').addEventListener('click', (e)=>{ e.stopPropagation(); addToCart(p.id, addBtn); });
      card.querySelector('.minus').addEventListener('click', (e)=>{ e.stopPropagation(); changeQty(p.id, -1); });
    }
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.wa-btn, .add-row')) return;
      openModal(p);
    });
    frag.appendChild(card);
  });
  grid.appendChild(frag);
  try{ syncCardControls(); }catch(e){} // el carrito se inicializa más abajo
}

[searchInput, generoFilter, presFilter, sortSelect].forEach(el=>{
  el.addEventListener('input', render);
  el.addEventListener('change', render);
});

resetBtn.addEventListener('click', ()=>{
  searchInput.value = '';
  generoFilter.value = '';
  presFilter.value = '';
  sortSelect.value = 'nombre';
  render();
});

render();

const modalOverlay = document.getElementById('modalOverlay');
const modalImgWrap = document.getElementById('modalImgWrap');
const modalClose = document.getElementById('modalClose');

function openModal(p){
  modalImgWrap.innerHTML = p.img
    ? `<img id="modalImg" src="${p.img}" alt="${p.nombre}" onerror="this.parentElement.innerHTML='<div class=&quot;no-photo&quot;>Foto<br>pendiente</div>'">`
    : `<div class="no-photo">Foto<br>pendiente</div>`;
  modalOverlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  modalOverlay.classList.remove('show');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e)=>{
  if(e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && modalOverlay.classList.contains('show')) closeModal();
});
// ======= CARRITO =======
const CART_KEY = 'scentra_cart_v1';
const MAX_QTY = 99;
const PRODUCT_BY_ID = {};
PRODUCTS.forEach(p=>{ PRODUCT_BY_ID[p.id] = p; });
let cart = []; // [{id, qty}] en orden de agregado

const cartOverlay = document.getElementById('cartOverlay');
const cartList = document.getElementById('cartList');
const cartSub = document.getElementById('cartSub');
const cartTotalEl = document.getElementById('cartTotal');
const cartWaBtn = document.getElementById('cartWaBtn');
const cartClearBtn = document.getElementById('cartClearBtn');
const cartConfirm = document.getElementById('cartConfirm');
const cartFloatBadge = document.getElementById('cartFloatBadge');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function loadCart(){
  try{
    const raw = localStorage.getItem(CART_KEY);
    if(!raw) return;
    const arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return;
    arr.forEach(it=>{
      const p = PRODUCT_BY_ID[it.id];
      const q = parseInt(it.qty, 10);
      if(p && p.precio > 0 && q > 0 && !cart.some(c=>c.id === p.id)){
        cart.push({id:p.id, qty:Math.min(q, MAX_QTY)});
      }
    });
  }catch(e){}
}
function saveCart(){
  try{ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }catch(e){}
}

function cartTotals(){
  let units = 0, total = 0;
  cart.forEach(it=>{
    units += it.qty;
    total += it.qty * PRODUCT_BY_ID[it.id].precio;
  });
  return {products:cart.length, units, total};
}
function unitsLabel(n){ return n === 1 ? '1 unidad' : `${n} unidades`; }

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

function addToCart(id, btn){
  const p = PRODUCT_BY_ID[id];
  if(!p || !(p.precio > 0)) return; // sin precio válido no se agrega
  const it = cart.find(c=>c.id === id);
  if(it){ it.qty = Math.min(it.qty + 1, MAX_QTY); }
  else{ cart.push({id, qty:1}); }
  renderCart();
  showToast(`${p.nombre} agregado al carrito`);
  if(btn){
    btn.classList.add('added');
    btn.textContent = '✓ Agregado';
    clearTimeout(btn._t);
    btn._t = setTimeout(()=>{
      btn.classList.remove('added');
      btn.textContent = 'Agregar al carrito';
    }, 1200);
  }
}

function syncCardControls(){
  document.querySelectorAll('.add-row').forEach(row=>{
    const id = row.querySelector('.add-btn').dataset.id;
    const it = cart.find(c=>String(c.id) === String(id));
    row.querySelector('.minus').disabled = !it;
  });
}

function changeQty(id, delta){
  const i = cart.findIndex(c=>c.id === id);
  if(i < 0) return;
  cart[i].qty = Math.min(cart[i].qty + delta, MAX_QTY);
  if(cart[i].qty <= 0) cart.splice(i, 1);
  renderCart();
}
function removeFromCart(id){
  cart = cart.filter(c=>c.id !== id);
  renderCart();
}

function buildOrderMessage(){
  const items = cart.map(it=>{
    const p = PRODUCT_BY_ID[it.id];
    return `${it.qty}x ${p.nombre} ${p.presentacion}\n${money(p.precio)} c/u: ${money(p.precio * it.qty)}`;
  });
  return 'Hola, Scentra. Quiero consultar por el siguiente pedido:\n\n' +
    'MI PEDIDO\n\n' +
    items.join('\n\n') +
    `\n\nTOTAL: ${money(cartTotals().total)}\n\n` +
    '¿Me puede confirmar disponibilidad?';
}

function renderCart(){
  const t = cartTotals();

  // contadores
  cartFloatBadge.textContent = t.units;
  cartFloatBadge.classList.toggle('show', t.units > 0);
  syncCardControls();

  // panel
  cartSub.textContent = t.units > 0
    ? `${t.products} ${t.products === 1 ? 'producto' : 'productos'} · ${t.units} ${t.units === 1 ? 'unidad' : 'unidades'}`
    : 'Sin productos';
  cartTotalEl.textContent = money(t.total);

  if(cart.length === 0){
    cartList.innerHTML = '<div class="cart-empty">Tu carrito está vacío.<br>Agregá perfumes desde el catálogo.</div>';
  }else{
    cartList.innerHTML = cart.map(it=>{
      const p = PRODUCT_BY_ID[it.id];
      return `
      <div class="cart-item">
        <div class="ci-name">${esc(p.nombre)}</div>
        <div class="ci-meta">${esc(p.marca)} · ${esc(p.presentacion)} · ${money(p.precio)} c/u</div>
        <div class="ci-row">
          <div class="qty">
            <button type="button" data-act="dec" data-id="${p.id}" aria-label="Disminuir cantidad">&minus;</button>
            <span>${it.qty}</span>
            <button type="button" data-act="inc" data-id="${p.id}" aria-label="Aumentar cantidad">+</button>
          </div>
          <div class="ci-sub">Subtotal: ${money(p.precio * it.qty)}</div>
        </div>
        <button type="button" class="ci-del" data-act="del" data-id="${p.id}">Eliminar</button>
      </div>`;
    }).join('');
  }

  // WhatsApp: abre el chat con el mensaje preparado (no se envía solo)
  if(cart.length > 0){
    cartWaBtn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(buildOrderMessage())}`;
    cartWaBtn.classList.remove('disabled');
  }else{
    cartWaBtn.href = '#';
    cartWaBtn.classList.add('disabled');
  }
  cartClearBtn.disabled = cart.length === 0;
  saveCart();
}

function openCart(){
  renderCart();
  cartConfirm.classList.remove('show');
  cartOverlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeCart(){
  cartConfirm.classList.remove('show');
  cartOverlay.classList.remove('show');
  document.body.style.overflow = '';
}

cartList.addEventListener('click', (e)=>{
  const b = e.target.closest('button[data-act]');
  if(!b) return;
  const id = parseInt(b.dataset.id, 10);
  if(b.dataset.act === 'inc') changeQty(id, 1);
  if(b.dataset.act === 'dec') changeQty(id, -1);
  if(b.dataset.act === 'del') removeFromCart(id);
});
document.getElementById('cartFloatBtn').addEventListener('click', openCart);
document.getElementById('cartClose').addEventListener('click', closeCart);
document.getElementById('cartKeep').addEventListener('click', closeCart);
cartOverlay.addEventListener('click', (e)=>{ if(e.target === cartOverlay) closeCart(); });
cartWaBtn.addEventListener('click', (e)=>{ if(cart.length === 0) e.preventDefault(); });
cartClearBtn.addEventListener('click', ()=>{ if(cart.length) cartConfirm.classList.add('show'); });
document.getElementById('confirmCancel').addEventListener('click', ()=>cartConfirm.classList.remove('show'));
document.getElementById('confirmOk').addEventListener('click', ()=>{
  cart = [];
  renderCart();
  cartConfirm.classList.remove('show');
});
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape' || !cartOverlay.classList.contains('show')) return;
  if(cartConfirm.classList.contains('show')) cartConfirm.classList.remove('show');
  else closeCart();
});

loadCart();
renderCart();
</script>
</body>
</html>
